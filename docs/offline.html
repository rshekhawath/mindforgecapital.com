<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; form-action 'none'">
<title>You're offline — MindForge Capital</title>
  <link rel="icon" href="/assets/favicon-32.png" type="image/png">
<!-- V44.3 — what the service worker shows when there is no connection and the page asked for
     was never saved. Until now that was a precached copy of the whole home page, which every
     first-time visitor downloaded a second time (191 KB gzipped) whichever page they landed on,
     for a case most of them never meet. It also went stale: every homepage edit needed a cache
     bump just so an offline copy of the marketing page stayed true. This page holds no prices,
     no figures and no claims, so it cannot go stale. Everything it needs is in this file. -->
<style>
:root{color-scheme:light dark}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  background:#f0f5ff;color:#0c1831}
main{max-width:420px;text-align:center}
img{display:block;margin:0 auto 18px}
h1{margin:0 0 8px;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 22px;color:#1e3a5f}
button{min-height:44px;padding:0 22px;border:0;border-radius:10px;background:#1a50d8;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:2px solid #1a50d8;outline-offset:3px}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]) body{background:#080d1a;color:#f0f5ff}
  html:not([data-theme="light"]) p{color:#c7d6f0}
  html:not([data-theme="light"]) button{background:#2563eb}
  html:not([data-theme="light"]) button:focus-visible{outline-color:#83aaff}
}
/* V45.1 — the site's own light/dark switch wins over the system setting here too, as on every other page */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"] body{background:#080d1a;color:#f0f5ff}
html[data-theme="dark"] p{color:#c7d6f0}
html[data-theme="dark"] button{background:#2563eb}
html[data-theme="dark"] button:focus-visible{outline-color:#83aaff}
</style>
<script>try{var t=localStorage.getItem('mfc-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<main>
  <img src="/assets/favicon-192.png" alt="" width="64" height="64">
  <h1>You're offline</h1>
  <p>This page needs a connection. Check yours and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
