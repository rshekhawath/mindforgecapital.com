<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- V11.4 security hardening (additive): restrict resource origins to self + the Apps Script backend, block plugins & base-tag injection.
     V28.7: frame-ancestors dropped from the policy. A meta-delivered CSP cannot carry that directive, so every browser ignored it
     and logged a Content-Security-Policy error on every page load of every page here, and GitHub Pages cannot send the response
     header that would make it real. Nothing is lost: the clickjacking guard below is the script that actually refuses framing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://*.googleusercontent.com; form-action 'self' https://script.google.com; frame-src 'none'; media-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=(), browsing-topics=(), serial=(), bluetooth=(), hid=(), midi=(), idle-detection=(), display-capture=(), autoplay=(), screen-wake-lock=(), xr-spatial-tracking=()">
<script>/* V11.4 clickjacking guard: refuse cross-origin framing */(function(){try{if(window.self===window.top)return;var s=false;try{s=window.top.location.origin===window.location.origin;}catch(e){s=false;}if(!s){try{window.top.location.replace(window.location.href);}catch(e){document.documentElement.style.visibility="hidden";}}}catch(e){}})();</script>
<!-- V11.4 premium PWA/install metadata: consistent, installable, light-rendered -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1a50d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MindForge Capital">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Scanner — MindForge Capital</title>
<meta name="description" content="Scanner — quantitative equity screening across the full NSE universe.">
<link rel="canonical" href="https://mindforgecapital.com/screener/">
<!-- V25.6: the sibling redirect stub scanner.html has carried noindex since it
     was created; this one did not, so the two legacy URLs pointing at the same
     destination were handled two different ways. Matched to the established
     pattern — the meta-refresh below does the redirecting, the canonical
     consolidates, and noindex keeps the stub itself out of the index. -->
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=screener/">
<link rel="icon" href="assets/favicon-32.png" type="image/png">
<script>location.replace("screener/" + location.search + location.hash);</script>
<style>
  /* V32.2 — the four redirect shims are the only pages on the site that decided
     their own theme, and all four decided it wrong. Three (scanner.html,
     scanner/index.html, screener.html) were hard-coded light, so a member in dark
     mode got a full-white flash on the way to a dark page; the fourth
     (screener/company.html) was dark-aware but keyed off @media
     (prefers-color-scheme), which is NOT how this site chooses — the theme is an
     explicit opt-in stored in localStorage['mfc-theme'] and DEFAULTS TO LIGHT
     (see the shared bootstrap in index.html). Following the OS instead of the
     stored choice is wrong in both directions: dark-OS/light-site got a dark
     flash, light-OS/dark-site got a white one. All four now read the same key the
     rest of the site reads, before first paint, and style off [data-theme]. */
  :root{ --sb:#f0f5ff; --sc:#0c1831; --sm:#475569; --sa:#1a50d8; --sr:rgba(37,99,235,.18); --scard:#ffffff; --sbd:rgba(37,99,235,.14); }
  html[data-theme="dark"]{ --sb:#080d1a; --sc:#e7edfb; --sm:#94a3b8; --sa:#5b8def; --sr:rgba(120,150,255,.22); --scard:#0f1626; --sbd:rgba(120,150,255,.16); color-scheme:dark; }
  html,body{height:100%;margin:0}
  body{background:var(--sb);color:var(--sc);
       font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:420px;padding:30px 26px;border-radius:18px;background:var(--scard);
       border:0.5px solid var(--sbd);box-shadow:0 1px 2px rgba(15,23,42,.04),0 18px 44px -26px rgba(26,80,216,.30)}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--sr);
           border-top-color:var(--sa);margin:0 auto 16px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .box p{margin:0;font-size:15px;line-height:1.6;color:var(--sm)}
  .box b{display:block;margin-bottom:6px;font-size:17px;font-weight:700;color:var(--sc);letter-spacing:-.01em}
  a.go{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:10px;
       font-size:14px;font-weight:700;color:#fff;text-decoration:none;
       background:linear-gradient(135deg,#1a50d8,#0891b2)}
  a.go:focus-visible{outline:2px solid var(--sa);outline-offset:3px}
  /* The spinner was the one piece of motion on the site with no reduced-motion
     guard at all — an infinite rotation on a page you cannot dismiss. */
  @media (prefers-reduced-motion: reduce){
    .spinner{animation:none;border-top-color:var(--sa);opacity:.85}
  }
</style>
<script>/* V32.2: same rule as the site-wide bootstrap — explicit opt-in, default light. */
(function(){try{var t=localStorage.getItem('mfc-theme')==='dark'?'dark':'light';
document.documentElement.setAttribute('data-theme',t);
var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#080d1a':'#1a50d8');}catch(e){}})();</script>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <p><b>Opening the Stock Scanner…</b>Screening 2,000+ NSE companies on 40+ fundamentals.</p>
    <a class="go" href="screener/">Go to the Scanner →</a>
  </div>
</body>
</html>
