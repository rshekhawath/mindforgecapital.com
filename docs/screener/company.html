<!DOCTYPE html>
<html lang="en-IN">
<head>
<!-- V28.7 clickjacking guard: every hand-written page on this site has carried this since V11.4,
     and the pages generated by screener/export_static.py never did. Dropping the inert meta
     frame-ancestors directive is what made that visible: these pages were relying on a directive
     no browser honours, so their framing protection was the empty set. Byte-identical to index.html. -->
<script>/* V11.4 clickjacking guard: refuse cross-origin framing */(function(){try{if(window.self===window.top)return;var s=false;try{s=window.top.location.origin===window.location.origin;}catch(e){s=false;}if(!s){try{window.top.location.replace(window.location.href);}catch(e){document.documentElement.style.visibility="hidden";}}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to the full equity report — MindForge Capital</title>
<!--
  ============================================================================
  V26.8 — CANONICAL PER-STOCK PAGE CONSOLIDATION
  ----------------------------------------------------------------------------
  This page used to be the Scanner's own per-stock report. It has been retired:
  /scores/company.html is now the single canonical per-stock page.

  Why: the two pages had converged. Once the shared deep-dive (assets/
  mfc-company.js, V23.4+) was mounted on BOTH, the Integrity-Score page rendered
  every card this one did — Overview, Ratios & Valuation, Shareholding and the
  whole Company deep-dive — PLUS the Integrity-Score pillars and the
  "Valuation trend · P/E" chart. It was a strict superset, so keeping two URLs
  for one report only split crawl budget and gave members a thinner page
  depending on which lister they happened to click from.

  This file is deliberately NOT deleted. ~2,126 /screener/company.html?symbol=
  URLs were published in the stock sitemap since V25.6 and are indexed and
  linked; deleting the page would 404 every one of them. A redirect preserves
  them, forwards the ?symbol= (and any #hash) untouched, and consolidates the
  ranking signals onto the canonical URL.

  GitHub Pages cannot issue a real 301, so this uses the standard static-host
  equivalent: an immediate JS location.replace() (replace, not assign, so the
  back button does not bounce the visitor straight back here), a <meta refresh>
  fallback for no-JS clients, a rel=canonical pointing at the target, and a
  visible link if both fail. No stylesheet, no shared assets — nothing that
  would delay the hop.
  ========================================================================== -->
<link rel="canonical" href="https://mindforgecapital.com/scores/company.html">
<meta name="referrer" content="no-referrer-when-downgrade">
<script>
  (function () {
    try {
      var target = "/scores/company.html" + (location.search || "") + (location.hash || "");
      // keep the canonical honest for the split second this document exists
      var sym = new URLSearchParams(location.search).get("symbol");
      if (sym) {
        var c = document.querySelector('link[rel="canonical"]');
        if (c) c.href = "https://mindforgecapital.com/scores/company.html?symbol=" + encodeURIComponent(sym);
      }
      location.replace(target);
    } catch (e) {
      location.replace("/scores/company.html");
    }
  })();
</script>
<meta http-equiv="refresh" content="0; url=/scores/company.html">
<style>
  /* V32.2 — the four redirect shims are the only pages on the site that decided
     their own theme, and all four decided it wrong. Three (scanner.html,
     scanner/index.html, screener.html) were hard-coded light, so a member in dark
     mode got a full-white flash on the way to a dark page; the fourth
     (screener/company.html) was dark-aware but keyed off @media
     (prefers-color-scheme), which is NOT how this site chooses — the theme is an
     explicit opt-in stored in localStorage['mfc-theme'] and DEFAULTS TO LIGHT
     (see the shared bootstrap in index.html). Following the OS instead of the
     stored choice is wrong in both directions: dark-OS/light-site got a dark
     flash, light-OS/dark-site got a white one. All four now read the same key the
     rest of the site reads, before first paint, and style off [data-theme]. */
  :root{ --sb:#f0f5ff; --sc:#0c1831; --sm:#475569; --sa:#1a50d8; --sr:rgba(37,99,235,.18); --scard:#ffffff; --sbd:rgba(37,99,235,.14); }
  html[data-theme="dark"]{ --sb:#080d1a; --sc:#e7edfb; --sm:#94a3b8; --sa:#5b8def; --sr:rgba(120,150,255,.22); --scard:#0f1626; --sbd:rgba(120,150,255,.16); color-scheme:dark; }
  html,body{height:100%;margin:0}
  body{background:var(--sb);color:var(--sc);
       font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:420px;padding:30px 26px;border-radius:18px;background:var(--scard);
       border:0.5px solid var(--sbd);box-shadow:0 1px 2px rgba(15,23,42,.04),0 18px 44px -26px rgba(26,80,216,.30)}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--sr);
           border-top-color:var(--sa);margin:0 auto 16px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .box p{margin:0;font-size:15px;line-height:1.6;color:var(--sm)}
  .box b{display:block;margin-bottom:6px;font-size:17px;font-weight:700;color:var(--sc);letter-spacing:-.01em}
  a.go{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:10px;
       font-size:14px;font-weight:700;color:#fff;text-decoration:none;
       background:linear-gradient(135deg,#1a50d8,#0891b2)}
  a.go:focus-visible{outline:2px solid var(--sa);outline-offset:3px}
  /* The spinner was the one piece of motion on the site with no reduced-motion
     guard at all — an infinite rotation on a page you cannot dismiss. */
  @media (prefers-reduced-motion: reduce){
    .spinner{animation:none;border-top-color:var(--sa);opacity:.85}
  }
</style>
<script>/* V32.2: same rule as the site-wide bootstrap — explicit opt-in, default light. */
(function(){try{var t=localStorage.getItem('mfc-theme')==='dark'?'dark':'light';
document.documentElement.setAttribute('data-theme',t);
var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#080d1a':'#1a50d8');}catch(e){}})();</script>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <p><b>Opening the full equity report…</b>Integrity Score, fundamentals and history for this company.</p>
    <a class="go" id="fallback" href="/scores/company.html">Continue to the report →</a>
  </div>
  <script>
    // point the visible fallback at the symbol too, for the no-JS-redirect edge case
    (function () {
      try {
        var sym = new URLSearchParams(location.search).get("symbol");
        if (sym) document.getElementById("fallback").href =
          "/scores/company.html?symbol=" + encodeURIComponent(sym);
      } catch (e) {}
    })();
  </script>
</body>
</html>
